<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src {{cspSource}} 'unsafe-inline'; img-src {{cspSource}} https: http: data: blob:;">
    <title>VS Music Player</title>
    <link rel="stylesheet" href="{{cssUri}}">
</head>

<body>
    <div class="music-container">
        <!-- Attribution in top-right corner -->
        <div class="attribution">
            <a href="http://github.com/codershubinc" target="_blank" rel="noopener noreferrer">@codershubinc</a>
        </div>

        <div id="no-music" class="no-music-container">
            <div class="music-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
            <h2>No music currently playing</h2>
            <p>Start playing music from any MPRIS-compatible player</p>
            <div class="supported-players">
                <span>Spotify</span>
                <span>VLC</span>
                <span>Rhythmbox</span>
                <span>Chrome</span>
            </div>
        </div>

        <div id="music-info" class="music-info hidden">
            <div class="track-container">
                <div id="album-art">
                    <div class="artwork-placeholder"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
                </div>
                <div class="track-details">
                    <div id="status-indicator" class="status-indicator"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>
                    <div id="track-title">Loading...</div>
                    <div id="track-artist">Please wait...</div>
                    <div id="track-album">Initializing...</div>
                </div>
            </div>
            <!-- Currently removing the progress bar until fixed -->

            <div id="progress-container">
                <div id="progress-bar">
                    <div id="progress-fill"></div>
                </div>
                <div class="progress-time">
                    <span id="current-time">0:00</span>
                    <span id="total-time">0:00</span>
                </div>
            </div>

            <div class="controls">
                <button class="control-btn" id="prev-btn" title="Previous"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
                <button class="control-btn play-pause-btn" id="play-pause-btn" title="Play/Pause"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
                <button class="control-btn" id="next-btn" title="Next"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
            </div>
        </div>
    </div>

    <script type="module" src="{{jsUri}}"></script>
</body>

</html>
